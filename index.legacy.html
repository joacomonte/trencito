<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Urquiza" />
  <meta name="theme-color" content="#FBF5E9" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚆</text></svg>" />
  <title>Tren Urquiza — ¿Cuánto falta?</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.1/dist/basecoat.cdn.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.1/dist/js/all.min.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    /* ── Theme "Toshiba": amarillo Urquiza, antifaz negro, chevrones rojo/blanco ── */
    :root {
      --background: #FBF5E9;          /* crema cálido, papel de boletería */
      --foreground: #26262A;          /* gris antifaz, casi negro */
      --card: #FFFFFF;
      --card-foreground: #26262A;
      --primary: #F2A900;             /* amarillo Toshiba */
      --primary-foreground: #26262A;  /* texto negro sobre amarillo, como el tren */
      --secondary: #F3EAD5;
      --secondary-foreground: #26262A;
      --muted: #EFE7D3;
      --muted-foreground: #77716A;
      --accent: #F3EAD5;
      --accent-foreground: #26262A;
      --destructive: #C8102E;         /* rojo chevron */
      --border: #E4D9BE;
      --input: #E4D9BE;
      --ring: #F2A900;
    }
    /* Fondo moderno: glow ámbar arriba + líneas de velocidad diagonales apenas visibles */
    body {
      background-color: var(--background);
      background-image:
        radial-gradient(80% 45% at 50% -10%, rgb(242 169 0 / .18), transparent 70%),
        radial-gradient(70% 40% at 50% 110%, rgb(38 38 42 / .07), transparent 70%),
        repeating-linear-gradient(115deg, transparent 0 46px, rgb(38 38 42 / .025) 46px 48px);
      background-attachment: fixed;
    }
    .chevron {
      height: .5rem;
      background: repeating-linear-gradient(135deg, #C8102E 0 12px, #fff 12px 24px);
      border-radius: 9999px;
    }
    .sign {
      display: inline-block; background: #26262A; color: #fff;
      border-radius: 9999px; padding: .375rem 1.25rem;
      font-weight: 700; letter-spacing: .06em;
    }
    .hl { background: linear-gradient(transparent 60%, rgb(242 169 0 / .5) 60%); padding: 0 .15em }
    /* ── Paso 3: escena ferroviaria animada ── */
    @keyframes chug { 0%,100% { translate: 0 0 } 50% { translate: 0 -3px } }
    @keyframes rails-l { to { background-position-x: -48px } }
    @keyframes rails-r { to { background-position-x: 48px } }
    @keyframes postes-l { to { background-position-x: -180px } }
    @keyframes postes-r { to { background-position-x: 180px } }
    @keyframes edif-l { to { background-position-x: -280px } }
    @keyframes edif-r { to { background-position-x: 280px } }
    @keyframes nubes-l { to { background-position-x: -340px } }
    @keyframes nubes-r { to { background-position-x: 340px } }
    /* -96px/384px y -64px/256px: múltiplos exactos del tile (96 y 64) para loopear sin salto */
    @keyframes lluvia-cae { to { background-position: -96px 384px, -64px 256px } }
    /* dos destellos por ciclo de 6s, cada uno sincronizado con su rayo */
    @keyframes relampago { 0%, 37%, 41%, 87%, 91%, 100% { opacity: 0 } 38%, 40% { opacity: .45 } 88%, 90% { opacity: .55 } }
    @keyframes rayo-1 { 0%, 37%, 41%, 100% { opacity: 0 } 38%, 40% { opacity: 1 } }
    @keyframes rayo-2 { 0%, 87%, 91%, 100% { opacity: 0 } 88%, 90% { opacity: 1 } }
    .scene { position: absolute; inset: 0; overflow: hidden }
    /* texto apenas translúcido para que se aprecie la escena detrás */
    .scene-content { position: relative; z-index: 10; pointer-events: none; opacity: .82 }
    /* cielo según clima */
    .scene--soleado { background: linear-gradient(180deg, rgb(178 222 245 / .8), rgb(178 222 245 / 0) 75%) }
    .scene--nublado { background: linear-gradient(180deg, rgb(190 196 202 / .8), rgb(190 196 202 / 0) 85%) }
    .scene--lluvia  { background: linear-gradient(180deg, rgb(150 162 173 / .85), rgb(150 162 173 / .1) 95%) }
    .scene--tormenta { background: linear-gradient(180deg, rgb(103 115 128 / .9), rgb(103 115 128 / .15) 95%) }
    .scene-sol { position: absolute; top: .5rem; left: .875rem; font-size: 1.75rem; line-height: 1; display: none }
    .scene--soleado .scene-sol { display: block }
    .scene-nubes {
      position: absolute; left: 0; right: 0; top: 4px; height: 44px;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='340' height='44' viewBox='0 0 340 44'><g fill='white' fill-opacity='.9'><ellipse cx='44' cy='26' rx='28' ry='10'/><ellipse cx='64' cy='18' rx='18' ry='9'/><ellipse cx='196' cy='22' rx='32' ry='11'/><ellipse cx='222' cy='14' rx='17' ry='8'/></g></svg>");
      background-repeat: repeat-x;
      animation: nubes-l 30s linear infinite;
    }
    .scene--nublado .scene-nubes, .scene--lluvia .scene-nubes, .scene--tormenta .scene-nubes {
      filter: brightness(.82) saturate(.5);
    }
    .scene-edificios {
      position: absolute; left: 0; right: 0; bottom: 12px; height: 68px;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='68' viewBox='0 0 280 68'><g fill='%2377716A' fill-opacity='.28'><rect x='0' y='26' width='34' height='42'/><rect x='40' y='10' width='26' height='58'/><line x1='53' y1='10' x2='53' y2='2' stroke='%2377716A' stroke-opacity='.28' stroke-width='2'/><rect x='72' y='34' width='40' height='34'/><rect x='126' y='16' width='22' height='52'/><rect x='158' y='30' width='36' height='38'/><rect x='206' y='6' width='28' height='62'/><rect x='240' y='38' width='30' height='30'/></g></svg>");
      background-repeat: repeat-x;
      background-position-y: bottom;
      animation: edif-l 8s linear infinite;
    }
    .scene-postes {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='88' viewBox='0 0 180 88'><g stroke='%2377716A' stroke-opacity='.35' stroke-width='3'><line x1='30' y1='18' x2='30' y2='66'/><line x1='18' y1='24' x2='42' y2='24'/></g></svg>");
      background-repeat: repeat-x;
      background-position-y: bottom;
      animation: postes-l 2.4s linear infinite;
    }
    /* dos capas de gotas: cercanas (grandes, rápidas) y lejanas (chicas, lentas, más tenues) */
    .scene-lluvia {
      position: absolute; inset: 0; display: none; pointer-events: none;
      background-image:
        url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'><g stroke='%234A6076' stroke-opacity='.4' stroke-width='2.5' stroke-linecap='round'><line x1='20' y1='4' x2='16.5' y2='18'/><line x1='70' y1='14' x2='66.5' y2='28'/><line x1='44' y1='46' x2='40.5' y2='60'/><line x1='88' y1='60' x2='84.5' y2='74'/></g></svg>"),
        url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'><g stroke='%234A6076' stroke-opacity='.22' stroke-width='2' stroke-linecap='round'><line x1='32' y1='10' x2='28.5' y2='24'/><line x1='78' y1='40' x2='74.5' y2='54'/><line x1='10' y1='64' x2='6.5' y2='78'/></g></svg>");
      background-size: 96px 96px, 64px 64px;
      animation: lluvia-cae 2.2s linear infinite;
    }
    .scene--lluvia .scene-lluvia, .scene--tormenta .scene-lluvia { display: block }
    .scene--tormenta::after {
      content: ''; position: absolute; inset: 0; background: #fff;
      opacity: 0; pointer-events: none; animation: relampago 6s linear infinite;
    }
    .scene-rayo { position: absolute; font-size: 3rem; line-height: 1; opacity: 0; display: none; pointer-events: none; filter: drop-shadow(0 0 8px rgb(255 220 80 / .9)) }
    .scene--tormenta .scene-rayo { display: block }
    .scene-rayo--1 { left: 18%; top: 12%; animation: rayo-1 6s linear infinite }
    .scene-rayo--2 { right: 22%; top: 17%; font-size: 2.25rem; animation: rayo-2 6s linear infinite }
    .scene-clima {
      position: absolute; top: .5rem; right: .5rem; z-index: 10;
      font-size: .75rem; padding: .25rem 1.5rem .25rem .625rem; border-radius: 9999px;
      background: rgb(255 255 255 / .8); border: 1px solid var(--border);
      color: var(--foreground); appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2377716A' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat: no-repeat; background-position: right .375rem center; background-size: .75rem;
    }
    .scene-rail {
      position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='14' viewBox='0 0 24 14'><rect x='4' y='4' width='8' height='10' rx='1.5' fill='%2377716A' fill-opacity='.55'/><rect x='0' y='0' width='24' height='3.5' fill='%23DE8620'/></svg>");
      background-repeat: repeat-x;
      animation: rails-l 0.5s linear infinite;
    }
    .scene-tren {
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      font-size: 2.25rem; line-height: 1; letter-spacing: -0.5em; white-space: nowrap;
      animation: chug .7s ease-in-out infinite;
    }
    .scene--rev .scene-postes { animation-name: postes-r }
    .scene--rev .scene-edificios { animation-name: edif-r }
    .scene--rev .scene-nubes { animation-name: nubes-r }
    .scene--rev .scene-rail { animation-name: rails-r }
    .scene--rev .scene-tren { transform: translateX(-50%) scaleX(-1) }
    .scene--stop .scene-postes, .scene--stop .scene-rail, .scene--stop .scene-tren,
    .scene--stop .scene-edificios { animation-play-state: paused }
    /* las nubes y la lluvia siguen: el clima no frena cuando el tren para */
    @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 70% { transform: scale(1.15) } 100% { transform: scale(1); opacity: 1 } }
    .pop { animation: pop .5s ease-out both }
    [x-cloak]{display:none!important}
    button, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent }
    .btn { transition: transform .1s ease }
    .btn:active { transform: scale(.97) }
    /* Estilo diagrama de línea: tarjeta gris, riel naranja con estación blanca */
    .station-btn {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 1.25rem; width: 100%;
      min-height: 5.5rem; padding: 1rem 1.25rem 1rem 1.5rem;
      border: none; border-radius: 1.25rem;
      background: #63666A; color: #fff;
      box-shadow: 0 2px 6px rgb(38 38 42 / .18);
      transition: transform .1s ease, box-shadow .1s ease;
      cursor: pointer;
    }
    .station-btn::before {
      content: ''; position: absolute; left: 2.0625rem; top: 0; bottom: 0;
      width: .5rem; background: #DE8620; transform: translateX(-50%);
    }
    .station-btn:active { transform: scale(.97); box-shadow: none }
    .station-btn:disabled { opacity: .4; pointer-events: none }
    .station-btn .text-muted-foreground { color: rgb(255 255 255 / .65) }
    .station-dot {
      position: relative; flex: none; width: 1.125rem; height: 1.125rem;
      border-radius: 9999px; background: #fff !important;
      box-shadow: 0 0 0 3px #DE8620;
    }
    .station-btn--ghost {
      min-height: 4rem; padding: .625rem 1.25rem;
      background: rgb(255 255 255 / .6); border: 1.5px dashed #B9AC8C; box-shadow: none;
      color: var(--foreground);
    }
    .station-btn--ghost:active { border-color: #DE8620 }
    .ghost-caret {
      flex: none; display: grid; place-items: center;
      width: 2.75rem; height: 2.75rem; border-radius: 9999px;
      background: var(--muted); color: var(--foreground);
    }
    .ghost-caret svg { width: 1.5rem; height: 1.5rem }
    .station-btn--ghost::before { display: none }
    .station-btn--ghost .text-muted-foreground { color: var(--muted-foreground) }
  </style>
  <script>
    function app() {
      const S = ['Federico Lacroze','Artigas','Arata','Francisco Beiró','El Libertador','Devoto','Lynch','Fernández Moreno','Lourdes','Tropezón','J.M. Bosch','Martín Coronado','Pablo Podestá','Jorge Newbery','Rubén Darío','Ejército de los Andes','Lasalle','Sargento Barrufaldi','Capitán Lozano','Teniente Agneta','Campo de Mayo','Sargento Cabral','General Lemos'];
      const TOTAL = 48;
      const cum = i => i * TOTAL / (S.length - 1);
      return {
        S, step: 1, origin: '', dir: 0, dest: null, clima: 'soleado',
        t0: null, etaTs: null, now: Date.now(),
        init() { setInterval(() => this.now = Date.now(), 1000) },
        get o() { return +this.origin },
        get terminal() { return this.dir === 1 ? S.length - 1 : 0 },
        get intermedias() {
          const list = [];
          if (!this.dir) return list;
          for (let i = this.o + this.dir; i !== this.terminal && i >= 0 && i < S.length; i += this.dir) list.push(i);
          return list;
        },
        elegir(i) {
          this.dest = +i;
          this.dir = this.dest > this.o ? 1 : -1;
          const min = Math.abs(cum(this.dest) - cum(this.o));
          this.t0 = Date.now();
          this.etaTs = this.t0 + min * 60000;
          this.step = 3;
        },
        get restanteMs() { return Math.max(0, this.etaTs - this.now) },
        get llegue() { return this.restanteMs === 0 },
        get restanteMin() { return Math.floor(this.restanteMs / 60000) },
        get restanteSeg() { return String(Math.floor(this.restanteMs / 1000) % 60).padStart(2, '0') },
        get etaTxt() { return new Date(this.etaTs).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }) },
        get progreso() {
          const tot = this.etaTs - this.t0;
          return Math.min(100, Math.round((this.now - this.t0) / tot * 100));
        },
        get ruta() {
          if (!this.dir) return [];
          const r = [];
          for (let i = this.o; i !== this.dest; i += this.dir) r.push(i);
          r.push(this.dest);
          return r;
        },
        pct(i) { return Math.abs(cum(i) - cum(this.o)) / Math.abs(cum(this.dest) - cum(this.o)) * 100 },
        get prevIdx() { let p = this.o; for (const i of this.ruta) if (this.pct(i) <= this.progreso) p = i; return p },
        get nextIdx() { for (const i of this.ruta) { if (this.pct(i) > this.progreso) return i } return null },
        get posActual() {
          const pos = cum(this.o) + this.dir * (this.now - this.t0) / 60000;
          let best = this.o;
          for (const i of [...this.intermedias, this.dest, this.o]) {
            if (Math.abs(cum(i) - pos) < Math.abs(cum(best) - pos)) best = i;
          }
          return S[best];
        },
        reset() { this.step = 1; this.origin = ''; this.dir = 0; this.dest = null }
      }
    }
  </script>
</head>
<body class="bg-background text-foreground antialiased">

  <main x-data="app()" x-cloak class="min-h-dvh max-w-md mx-auto flex flex-col px-5 pt-[max(1.5rem,env(safe-area-inset-top))] pb-[max(1.25rem,env(safe-area-inset-bottom))] gap-5">

    <header class="relative text-center space-y-2">
      <button id="btn-back" x-show="step > 1" class="btn absolute left-0 top-0 size-14 rounded-full text-3xl z-10" data-variant="secondary" @click="step--" aria-label="Volver">←</button>
      <h1 class="sign text-xl">🚆 TREN URQUIZA</h1>
      <div class="chevron max-w-[10rem] mx-auto"></div>
      <p class="text-sm text-muted-foreground" x-show="step < 3">¿Cuánto falta para llegar?</p>
    </header>

    <section x-show="step === 1" class="flex-1 flex flex-col justify-center gap-3 pt-16">
      <h2 class="font-bold text-3xl tracking-tight text-center mb-4">¿En qué <span class="hl">estación</span><br>estás?</h2>
      <div class="flex flex-col gap-3 min-h-[16.5rem]">
      <button id="btn-origen-lacroze" class="station-btn" @click="origin = 0; step = 2">
        <span class="station-dot bg-primary"></span>
        <span class="flex-1 text-left">
          <span class="block text-2xl font-semibold leading-tight">Federico Lacroze</span>
          <span class="block text-sm text-muted-foreground">Colegiales</span>
        </span>
        <span class="text-muted-foreground text-xl">›</span>
      </button>
      <button id="btn-origen-lemos" class="station-btn" @click="origin = S.length - 1; step = 2">
        <span class="station-dot bg-primary"></span>
        <span class="flex-1 text-left">
          <span class="block text-2xl font-semibold leading-tight">General Lemos</span>
          <span class="block text-sm text-muted-foreground">San Miguel</span>
        </span>
        <span class="text-muted-foreground text-xl">›</span>
      </button>
      <label for="sel-origen" class="station-btn station-btn--ghost relative mt-1">
        <span class="flex-1 text-left text-lg font-medium text-muted-foreground">Otra estación…</span>
        <span class="ghost-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        <select id="sel-origen" class="absolute inset-0 opacity-0 w-full h-full" x-model="origin" @change="step = 2">
          <option value="" disabled selected>Otra estación…</option>
          <template x-for="(n, i) in S" :key="i">
            <option :value="i" x-text="n"></option>
          </template>
        </select>
      </label>
      </div>
    </section>

    <section x-show="step === 2" class="flex-1 flex flex-col justify-center gap-3 pt-16">
      <p class="text-center text-sm text-muted-foreground">Estás en <strong class="text-foreground" x-text="S[o]"></strong></p>
      <h2 class="font-bold text-3xl tracking-tight text-center mb-4">¿Dónde <span class="hl">te bajás</span>?</h2>
      <div class="flex flex-col gap-3 min-h-[16.5rem]">
      <button id="btn-dest-lemos" class="station-btn" x-show="o !== S.length - 1" @click="elegir(S.length - 1)">
        <span class="station-dot bg-primary"></span>
        <span class="flex-1 text-left">
          <span class="block text-2xl font-semibold leading-tight">General Lemos</span>
          <span class="block text-sm text-muted-foreground">San Miguel</span>
        </span>
        <span class="text-muted-foreground text-xl">›</span>
      </button>
      <button id="btn-dest-lacroze" class="station-btn" x-show="o !== 0" @click="elegir(0)">
        <span class="station-dot bg-primary"></span>
        <span class="flex-1 text-left">
          <span class="block text-2xl font-semibold leading-tight">Federico Lacroze</span>
          <span class="block text-sm text-muted-foreground">Colegiales</span>
        </span>
        <span class="text-muted-foreground text-xl">›</span>
      </button>
      <label for="sel-destino" class="station-btn station-btn--ghost relative mt-1">
        <span class="flex-1 text-left text-lg font-medium text-muted-foreground">Otra estación…</span>
        <span class="ghost-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        <select id="sel-destino" class="absolute inset-0 opacity-0 w-full h-full" @change="elegir($event.target.value); $event.target.selectedIndex = 0">
          <option value="" disabled selected>Otra estación…</option>
          <template x-for="(n, i) in S" :key="i">
            <option :value="i" x-text="n" :disabled="i === o"></option>
          </template>
        </select>
      </label>
      </div>
    </section>

    <section x-show="step === 3" class="flex-1 flex flex-col gap-5" x-cloak>
      <p class="text-center text-base text-muted-foreground flex items-center justify-center gap-2">
        <span x-text="S[o]"></span> → <span class="sign text-sm uppercase" x-text="S[dest]"></span>
      </p>

      <div class="card relative flex-1 flex flex-col text-center overflow-hidden p-0">
        <div class="scene" :class="['scene--' + clima, { 'scene--rev': dir === -1, 'scene--stop': llegue }]">
          <select id="sel-clima" class="scene-clima" x-model="clima" aria-label="Clima">
            <option value="soleado">☀️ Soleado</option>
            <option value="nublado">☁️ Nublado</option>
            <option value="lluvia">🌧️ Lluvia</option>
            <option value="tormenta">⛈️ Tormenta</option>
          </select>
          <span class="scene-sol">☀️</span>
          <div class="scene-nubes"></div>
          <div class="scene-edificios"></div>
          <div class="scene-postes"></div>
          <span class="scene-tren">🚃🚃🚃</span>
          <div class="scene-rail"></div>
          <div class="scene-lluvia"></div>
          <span class="scene-rayo scene-rayo--1">⚡</span>
          <span class="scene-rayo scene-rayo--2">⚡</span>
        </div>
        <template x-if="!llegue">
          <div class="scene-content flex-1 flex flex-col justify-center gap-1 px-6 pt-8 pb-28">
            <p class="text-sm text-muted-foreground">llegás a las</p>
            <p class="text-7xl font-bold tabular-nums tracking-tight" x-text="etaTxt"></p>
            <p class="text-lg text-muted-foreground mt-2">
              faltan <strong class="text-foreground tabular-nums"><span x-text="restanteMin"></span>:<span x-text="restanteSeg"></span></strong> min
            </p>
          </div>
        </template>
        <template x-if="llegue">
          <div class="scene-content flex-1 flex flex-col justify-center gap-2 px-6 pt-8 pb-28 pop">
            <p class="text-5xl">🎉</p>
            <p class="text-2xl font-bold">Llegaste a <span x-text="S[dest]"></span></p>
          </div>
        </template>
      </div>

      <div class="px-1" x-show="!llegue">
        <div class="relative h-4 text-xs mb-1">
          <span class="absolute whitespace-nowrap text-muted-foreground transition-all duration-1000"
            :style="`left:${pct(prevIdx)}%; transform:translateX(-${pct(prevIdx)}%)`">
            <span class="text-[0.625rem] uppercase tracking-wider opacity-70" x-text="progreso - pct(prevIdx) < 2 ? 'Estás en' : 'Pasaste'"></span>
            <span x-text="S[prevIdx]"></span>
          </span>
        </div>
        <div class="relative h-6">
          <div class="absolute inset-x-0 bottom-1.5 h-2.5 rounded-full" style="background:#DE8620"></div>
          <template x-for="i in ruta" :key="i">
            <span class="absolute bottom-[0.6875rem] rounded-full bg-white -translate-x-1/2 translate-y-1/2 shadow-sm"
              :class="(i === o || i === dest) ? 'w-3 h-3 ring-2 ring-white ring-offset-1 ring-offset-[#DE8620]' : 'w-2 h-2'"
              :style="`left:${pct(i)}%; opacity:${pct(i) <= progreso ? 1 : .5}`"></span>
          </template>
          <span class="absolute bottom-1 text-lg -translate-x-1/2 transition-all duration-1000" :style="`left:${progreso}%`">🚃</span>
        </div>
        <div class="relative h-4 text-xs mt-1">
          <span class="absolute whitespace-nowrap font-semibold transition-all duration-1000" x-show="nextIdx !== null"
            :style="nextIdx === null ? '' : `left:${pct(nextIdx)}%; transform:translateX(-${pct(nextIdx)}%)`">
            <span class="text-[0.625rem] uppercase tracking-wider font-normal text-muted-foreground" x-text="nextIdx === dest ? 'Bajás en' : 'Próxima'"></span>
            <span x-text="nextIdx === null ? '' : S[nextIdx] + ' →'"></span>
          </span>
        </div>
      </div>

      <button id="btn-reset" class="btn w-full h-16 text-xl rounded-2xl mt-auto" data-variant="outline" @click="reset()">↺ Nuevo viaje</button>
    </section>

    <p class="text-center text-xs text-muted-foreground" x-show="step === 3">Estimación prorrateada: 48 min punta a punta.</p>
  </main>

  <!-- Toaster global: dispará con document.getElementById('toaster').toast({...}) -->
  <div id="toaster" class="toaster" data-align="end"></div>
</body>
</html>
